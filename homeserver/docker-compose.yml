# =============================================================================
# docker-compose.yml — Unraid / Compose Manager Plus edition
#
# WHERE THIS FILE LIVES ON THE SERVER:
#   /mnt/user/appdata/homeserver/homeserver/docker-compose.yml
#
# HOW TO REGISTER WITH COMPOSE MANAGER PLUS:
#   Option A (recommended): In the plugin settings, change Projects Folder to
#     /mnt/user/appdata
#   Then "Add Stack" and it will detect this directory automatically.
#
#   Option B: Use "Indirect Path" in the plugin and point at this file directly.
#
# UNRAID-SPECIFIC DECISIONS IN THIS FILE:
#
#   Absolute paths everywhere — relative ./configs/ paths break when
#   Compose Manager Plus runs from its own working directory on /boot.
#   Every volume mount uses its full /mnt/user/... path.
#
#   Networks defined here, not external:true — on vanilla Linux you
#   pre-create networks before first run. On Unraid the Docker service
#   restarts on every boot, and external networks would need to be
#   recreated in a User Script before array start. Letting Compose own
#   them is simpler and correct.
#
#   No systemd — fan control and scheduled maintenance run via
#   Unraid's User Scripts plugin instead.
# =============================================================================

networks:
  # Single bridge network — services reach each other by container name.
  # e.g. radarr connects to sabnzbd at http://sabnzbd:8080/sabnzbd.
  # A previous revision split traffic into `medianet` + `cloudflared`, but the
  # tunnel container has to be on both (so it can route to every service it
  # fronts), which meant the split enforced nothing. Now: one network.
  medianet:
    name: medianet
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # CLOUDFLARE TUNNEL — fully configured by TUNNEL_TOKEN env var
  #
  # No healthcheck: cloudflared's image is distroless (no shell, no curl, no
  # wget). The container's own exit semantics + Docker restart policy are the
  # liveness signal here.
  # ---------------------------------------------------------------------------
  cloudflared:
    # cloudflared doesn't publish a float-tag channel; bump manually on updates.
    # Check https://github.com/cloudflare/cloudflared/releases for the current stable.
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - medianet
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # SABNZBD
  # sabnzbd.ini is pre-generated by generate-configs.py and bind-mounted
  # into the config directory. SABnzbd reads it on startup — no wizard.
  # ---------------------------------------------------------------------------
  sabnzbd:
    # hotio :release = stable channel, auto-absorbs patch-level updates
    image: ghcr.io/hotio/sabnzbd:release
    container_name: sabnzbd
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/sabnzbd:/config
      - ${STACK_DIR}/configs/sabnzbd/sabnzbd.ini:/config/sabnzbd.ini
      - /mnt/user/data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8080/sabnzbd/api?mode=version' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ---------------------------------------------------------------------------
  # PROWLARR — config.xml pre-generated, indexers wired by bootstrap.py
  # ---------------------------------------------------------------------------
  prowlarr:
    image: ghcr.io/hotio/prowlarr:release
    container_name: prowlarr
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/prowlarr:/config
      - ${STACK_DIR}/configs/prowlarr/config.xml:/config/config.xml
    ports:
      - "9696:9696"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/prowlarr/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # RADARR — config.xml pre-generated, root folder + download client via bootstrap.py
  # ---------------------------------------------------------------------------
  radarr:
    image: ghcr.io/hotio/radarr:release
    container_name: radarr
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/radarr:/config
      - ${STACK_DIR}/configs/radarr/config.xml:/config/config.xml
      - /mnt/user/data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    # service_healthy gates startup on the downstream's /ping actually responding,
    # not just the container process existing. bootstrap.py's retry loop was
    # papering over this race before.
    depends_on:
      sabnzbd:  { condition: service_healthy }
      prowlarr: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/radarr/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # SONARR
  # ---------------------------------------------------------------------------
  sonarr:
    image: ghcr.io/hotio/sonarr:release
    container_name: sonarr
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/sonarr:/config
      - ${STACK_DIR}/configs/sonarr/config.xml:/config/config.xml
      - /mnt/user/data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    depends_on:
      sabnzbd:  { condition: service_healthy }
      prowlarr: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/sonarr/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # LIDARR
  # ---------------------------------------------------------------------------
  lidarr:
    image: ghcr.io/hotio/lidarr:release
    container_name: lidarr
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/lidarr:/config
      - ${STACK_DIR}/configs/lidarr/config.xml:/config/config.xml
      - /mnt/user/data:/data
    ports:
      - "8686:8686"
    restart: unless-stopped
    depends_on:
      sabnzbd:  { condition: service_healthy }
      prowlarr: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8686/lidarr/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # PLEX — RTX 3050 NVENC transcoding
  # Requires Nvidia-Driver + nvidia-container-toolkit plugins, both rebooted.
  # PLEX_PREFERENCE_* vars are applied to Preferences.xml on FIRST BOOT ONLY
  # by the official plexinc/pms-docker image. After that, edit Preferences.xml
  # directly if you need to change them.
  # ---------------------------------------------------------------------------
  plex:
    # :public = Plex's stable public release channel
    image: plexinc/pms-docker:public
    container_name: plex
    runtime: nvidia
    networks:
      - medianet
    environment:
      - TZ=${TZ}
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
      - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=http://${PLEX_LAN_IP}:32400
      - ALLOWED_NETWORKS=${PLEX_LAN_SUBNET}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PLEX_PREFERENCE_FriendlyName=${PLEX_SERVER_NAME}
      - PLEX_PREFERENCE_LanNetworks=${PLEX_LAN_SUBNET}
      - PLEX_PREFERENCE_HardwareAcceleratedCodecs=1
      - PLEX_PREFERENCE_HardwareAcceleratedEncoders=1
      - PLEX_PREFERENCE_TranscoderQuality=0
      - PLEX_PREFERENCE_GenerateBIFBehavior=1
      - PLEX_PREFERENCE_GenerateChapterThumbBehavior=1
      - PLEX_PREFERENCE_MusicAnalysisBehavior=1
      - PLEX_PREFERENCE_CrashReportsOptedOut=1
      - PLEX_PREFERENCE_PushNotificationsEnabled=0
      - PLEX_PREFERENCE_RelayEnabled=0
      - PLEX_PREFERENCE_ScheduledLibraryUpdatesEnabled=1
      - PLEX_PREFERENCE_ScheduledLibraryUpdateAt=3
    volumes:
      - /mnt/user/appdata/plex:/config
      - /mnt/user/appdata/plex-transcode:/transcode
      # Read-only — Plex never needs to modify the library; the arr apps own writes.
      - /mnt/user/data/media:/data/media:ro
    ports:
      - "32400:32400"
      - "8324:8324"
      - "32469:32469"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    restart: unless-stopped
    healthcheck:
      # /identity is unauthenticated and returns quickly even during library scans.
      test: ["CMD-SHELL", "curl -fsS http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Plex can take a while to start after DB migrations or a crash recovery.
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G

  # ---------------------------------------------------------------------------
  # OVERSEERR — family-facing request portal
  # settings.json pre-generated, Plex + arr connections via bootstrap.py
  #
  # No `depends_on` block here: Overseerr connects to Radarr/Sonarr/Plex lazily
  # via HTTP at request time, not at container start, so ordering is only a
  # bootstrap.py concern (it waits for each service before wiring connections).
  # ---------------------------------------------------------------------------
  overseerr:
    image: ghcr.io/hotio/overseerr:release
    container_name: overseerr
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/overseerr:/config
      - ${STACK_DIR}/configs/overseerr/settings.json:/config/settings.json
    ports:
      - "5055:5055"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # TAUTULLI — Plex analytics, stream history, user activity, newsletters
  # config.ini is pre-seeded with the API key; the rest (Plex server
  # connection, notifications) is completed via the wizard on first open.
  # ---------------------------------------------------------------------------
  tautulli:
    image: ghcr.io/hotio/tautulli:release
    container_name: tautulli
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/tautulli:/config
      - ${STACK_DIR}/configs/tautulli/config.ini:/config/config.ini
    ports:
      - "8181:8181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # BAZARR — subtitle automation
  # config.ini pre-generated with Sonarr + Radarr connections.
  # Same lazy-HTTP rationale as Overseerr: no runtime `depends_on` needed.
  # ---------------------------------------------------------------------------
  bazarr:
    image: ghcr.io/hotio/bazarr:release
    container_name: bazarr
    networks:
      - medianet
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/bazarr:/config
      - ${STACK_DIR}/configs/bazarr/config.ini:/config/config.ini
      - /mnt/user/data/media:/data/media
    ports:
      - "6767:6767"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/bazarr/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
