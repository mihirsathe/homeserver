# =============================================================================
# docker-compose.yml — Unraid edition
#
# WHERE THIS FILE LIVES ON THE SERVER:
#   /mnt/user/appdata/homeserver/homeserver/docker-compose.yml
#
# HOW THE STACK IS BROUGHT UP:
#   Unraid ships `docker compose` in the base OS — no plugin needed. The
#   `media_stack_up` User Script (installed by setup-unraid.sh) runs at
#   array start and issues:
#     cd /mnt/user/appdata/homeserver/homeserver
#     docker compose --env-file .env.docker up -d
#
#   .env.docker is the merged result of .env + generated.env, written by
#   generate-configs.py. We use a single env-file (not two --env-file flags)
#   because docker compose's precedence between multiple --env-file files
#   has historically been brittle — a stale STACK_DIR= line in .env could
#   blank out the value generated.env provides, breaking every bind mount
#   below that uses ${STACK_DIR}.
#
# UNRAID-SPECIFIC DECISIONS IN THIS FILE:
#
#   Absolute paths everywhere — volume mounts use their full /mnt/user/...
#   path so Compose doesn't depend on the caller's working directory.
#
#   Networks defined here, not external:true — on vanilla Linux you
#   pre-create networks before first run. On Unraid the Docker service
#   restarts on every boot, and external networks would need to be
#   recreated in a User Script before array start. Letting Compose own
#   them is simpler and correct.
#
#   No systemd — fan control and scheduled maintenance run via
#   Unraid's User Scripts plugin instead.
#
# NETWORK PLANES:
#
#   downloaders  — gluetun, sabnzbd, prowlarr. SAB and Prowlarr share
#                  gluetun's netns so all their outbound traffic exits via
#                  Mullvad with a kill-switch. Only gluetun publishes ports.
#   frontend     — plex, seerr, tautulli, bazarr. Family-facing services.
#   automation   — sonarr, radarr, lidarr. Dual-homed to frontend (for
#                  seerr/bazarr/tautulli) and downloaders (to reach SAB and
#                  Prowlarr via gluetun). Blocks a popped frontend container
#                  from pivoting straight into the downloader plane.
#   ai           — ollama plus anything on the stack that needs local
#                  inference. Isolated from the media planes: nothing here
#                  has a reason to reach the *arrs or the downloaders, and
#                  Ollama has no auth of its own, so network membership is
#                  the access control.
#
# ADMIN INGRESS — Tailscale Services, no reverse proxy:
#   Every admin UI is a Tailscale Service (`svc:<name>`) advertised by the
#   HOST's tailscaled — the one the Unraid Tailscale plugin already runs.
#   Each service gets its own TailVIP, its own MagicDNS name, and its own
#   publicly-trusted auto-renewing certificate, so every admin URL is https://
#   and Secure Context is never a special case.
#
#   tailnet device → https://<name>.<tailnet>.ts.net → host tailscaled
#                  → 127.0.0.1:<port> → container
#
#   That is why every backend keeps a 127.0.0.1 publish: those loopback ports
#   are simultaneously bootstrap.py's probe target and the serve backend.
#   Nothing binds 0.0.0.0 except plex.
#
#   THERE IS NO REVERSE PROXY AND NO *.lan. Caddy, ts-caddy, AdGuard, the
#   Caddyfile generator and the Tailscale split-DNS rule are all deleted.
#   Caddy performed no middleware — no auth, no rate limiting — so its only
#   job was hostname-to-port mapping, which MagicDNS does for free and with a
#   real certificate. A proxy earns its place again when it becomes a policy
#   point (SSO), not a naming layer. See docs/decisions.md.
#
# THE UNRAID GUI KEEPS THE HOST'S :80:
#   http://DellBox/Main and http://<host tailnet IP>/ have no Docker
#   dependency, so they survive a stopped array or a broken image pull — the
#   situations where you most need a way in. On Unraid, stopping the array
#   stops Docker, which is exactly why the GUI must never sit behind anything
#   containerised.
#
# PUBLIC-FACING:
#   Only plex is reachable from the internet — TCP 32400 is port-forwarded
#   on the home router. Everything else is admin-only, reachable via
#   Tailscale (installed on the Unraid host, not inside containers).
# =============================================================================

networks:
  downloaders:
    name: downloaders
    driver: bridge
  frontend:
    name: frontend
    driver: bridge
  automation:
    name: automation
    driver: bridge
  # Local-inference plane. Join a container here and point it at
  # http://ollama:11434 — see the commented example below `ollama`.
  # Not `internal: true` — `ollama pull` has to reach registry.ollama.ai.
  ai:
    name: ai
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # GLUETUN — outbound VPN for SABnzbd + Prowlarr
  #
  # Mullvad WireGuard. FIREWALL=on enforces a kill-switch: if the tunnel drops,
  # SAB and Prowlarr have zero outbound connectivity. This is the whole point
  # — a misconfiguration fails closed, not open.
  #
  # Gluetun publishes SAB's 8080 and Prowlarr's 9696 on the host. Those
  # services remove their own `ports:` because they share gluetun's netns
  # (network_mode: "service:gluetun") and can't publish ports independently.
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${VPN_ADDRESS}
      - SERVER_CITIES=${VPN_CITY}
      - FIREWALL=on
      # Ports we want reachable from the LAN host through the gluetun netns.
      - FIREWALL_VPN_INPUT_PORTS=8080,9696
      - TZ=${TZ}
    networks:
      - downloaders
    ports:
      # SAB and Prowlarr are owned by gluetun's netns; their UIs are
      # published only on host loopback. These publishes are what
      # `tailscale serve` proxies to for svc:sab and svc:prowlarr, and what
      # bootstrap.py probes — not for direct LAN access.
      - "127.0.0.1:8080:8080"   # sabnzbd
      - "127.0.0.1:9696:9696"   # prowlarr
    restart: unless-stopped
    healthcheck:
      # Gluetun exposes its own health endpoint on 9999 (localhost-only).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/v1/openvpn/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # SABNZBD — inside gluetun's netns
  # sabnzbd.ini is pre-generated by generate-configs.py and bind-mounted
  # into the config directory. SABnzbd reads it on startup — no wizard.
  # ---------------------------------------------------------------------------
  sabnzbd:
    image: ghcr.io/hotio/sabnzbd:release
    container_name: sabnzbd
    # network_mode ties this container to gluetun's netns. No `networks:` and
    # no `ports:` — both are inherited from / owned by gluetun.
    network_mode: "service:gluetun"
    depends_on:
      gluetun: { condition: service_healthy }
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/sabnzbd:/config
      - ${STACK_DIR}/configs/sabnzbd/sabnzbd.ini:/config/sabnzbd.ini
      - /mnt/user/data:/data
      # Incomplete downloads live on the cache pool (SSD) — par2 repair and
      # unrar hammer this path, and doing it on spinning disks is 10–20×
      # slower. Separate cache-only share so mover never touches it.
      # Completed files move to /data/usenet/complete (array), where hardlinks
      # to /data/media work because both are on the same filesystem.
      - /mnt/user/usenet-incomplete:/incomplete
    restart: unless-stopped
    healthcheck:
      # Runs inside gluetun's netns, so localhost:8080 is SAB's own port.
      # SAB serves at root (UrlBase stripped); svc:sab fronts it.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8080/api?mode=version' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ---------------------------------------------------------------------------
  # PROWLARR — inside gluetun's netns
  # config.xml pre-generated, indexers wired by bootstrap.py
  # ---------------------------------------------------------------------------
  prowlarr:
    image: ghcr.io/hotio/prowlarr:release
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun: { condition: service_healthy }
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/prowlarr:/config
      - ${STACK_DIR}/configs/prowlarr/config.xml:/config/config.xml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # RADARR — dual-homed on automation + downloaders
  # Reaches SAB and Prowlarr through gluetun's published bridge endpoint.
  # config.xml pre-generated, root folder + download client via bootstrap.py
  # ---------------------------------------------------------------------------
  radarr:
    image: ghcr.io/hotio/radarr:release
    container_name: radarr
    networks:
      - automation
      - downloaders
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/radarr:/config
      - ${STACK_DIR}/configs/radarr/config.xml:/config/config.xml
      - /mnt/user/data:/data
    ports:
      # Loopback only. Backend for svc:radarr and the host debug path. Direct access
      # exists for bootstrap.py + host debugging, not LAN/Tailscale.
      - "127.0.0.1:7878:7878"
    restart: unless-stopped
    depends_on:
      sabnzbd:  { condition: service_healthy }
      prowlarr: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # SONARR
  # ---------------------------------------------------------------------------
  sonarr:
    image: ghcr.io/hotio/sonarr:release
    container_name: sonarr
    networks:
      - automation
      - downloaders
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/sonarr:/config
      - ${STACK_DIR}/configs/sonarr/config.xml:/config/config.xml
      - /mnt/user/data:/data
    ports:
      # Loopback only. Backend for svc:sonarr and the host debug path.
      - "127.0.0.1:8989:8989"
    restart: unless-stopped
    depends_on:
      sabnzbd:  { condition: service_healthy }
      prowlarr: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # LIDARR
  # ---------------------------------------------------------------------------
  lidarr:
    image: ghcr.io/hotio/lidarr:release
    container_name: lidarr
    networks:
      - automation
      - downloaders
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/lidarr:/config
      - ${STACK_DIR}/configs/lidarr/config.xml:/config/config.xml
      - /mnt/user/data:/data
    ports:
      # Loopback only. Backend for svc:lidarr and the host debug path.
      - "127.0.0.1:8686:8686"
    restart: unless-stopped
    depends_on:
      sabnzbd:  { condition: service_healthy }
      prowlarr: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8686/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # PLEX — RTX 3050 NVENC transcoding
  # Requires Nvidia-Driver + nvidia-container-toolkit plugins, both rebooted.
  # PLEX_PREFERENCE_* vars are applied to Preferences.xml on FIRST BOOT ONLY
  # by the official plexinc/pms-docker image. After that, edit Preferences.xml
  # directly if you need to change them.
  #
  # Only public-facing service: TCP 32400 is forwarded on the router. UDP
  # ports for DLNA/GDM are deliberately NOT published — DLNA is off and
  # clients discover via Plex account, not broadcast. Closes CVE-2021-33959
  # UDP amplification.
  # ---------------------------------------------------------------------------
  plex:
    image: plexinc/pms-docker:public
    container_name: plex
    runtime: nvidia
    networks:
      - frontend
    environment:
      - TZ=${TZ}
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
      - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=http://${PLEX_LAN_IP}:32400
      - ALLOWED_NETWORKS=${PLEX_LAN_SUBNET}
      # Minimal NVIDIA capability surface. `all` grants compute+utility+
      # video+graphics+display — way more than Plex needs, and historical
      # nvidia-container-toolkit escapes (CVE-2024-0132) abused the broader
      # set. compute+video is enough for NVENC/NVDEC.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video
      - PLEX_PREFERENCE_FriendlyName=${PLEX_SERVER_NAME}
      - PLEX_PREFERENCE_LanNetworks=${PLEX_LAN_SUBNET}
      - PLEX_PREFERENCE_HardwareAcceleratedCodecs=1
      - PLEX_PREFERENCE_HardwareAcceleratedEncoders=1
      - PLEX_PREFERENCE_TranscoderQuality=0
      - PLEX_PREFERENCE_GenerateBIFBehavior=1
      - PLEX_PREFERENCE_GenerateChapterThumbBehavior=1
      - PLEX_PREFERENCE_MusicAnalysisBehavior=1
      - PLEX_PREFERENCE_CrashReportsOptedOut=1
      - PLEX_PREFERENCE_PushNotificationsEnabled=0
      - PLEX_PREFERENCE_RelayEnabled=0
      - PLEX_PREFERENCE_ScheduledLibraryUpdatesEnabled=1
      - PLEX_PREFERENCE_ScheduledLibraryUpdateAt=3
      - PLEX_PREFERENCE_DlnaEnabled=0
    volumes:
      - /mnt/user/appdata/plex:/config
      - /mnt/user/appdata/plex-transcode:/transcode
      # Read-only — Plex never needs to modify the library; the arr apps own writes.
      - /mnt/user/data/media:/data/media:ro
    ports:
      # Only the main HTTP port is published. Router forwards WAN:32400 → here.
      - "32400:32400"
    restart: unless-stopped
    healthcheck:
      # /identity is unauthenticated and returns quickly even during library scans.
      test: ["CMD-SHELL", "curl -fsS http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Plex can take a while to start after DB migrations or a crash recovery.
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G

  # ---------------------------------------------------------------------------
  # SEERR — family request portal + Plex Watchlist auto-request
  # settings.json pre-generated, Plex + arr connections via bootstrap.py
  #
  # No public exposure — reachable only via Tailscale to the Unraid host's
  # LAN IP at :5055. Family never visits a Seerr URL; they add titles to
  # their Plex Watchlist and Seerr auto-requests within ~5–15 min.
  #
  # No `depends_on:` — Seerr connects to Plex/arr lazily via HTTP at request
  # time, not at container start. bootstrap.py waits per-service before wiring.
  #
  # UID note: Seerr's image runs as the `node` user (UID 1000) by default and
  # doesn't read PUID/PGID, but Docker's `user:` override works fine per
  # upstream (confirmed by a Seerr collaborator — the "remove user directive"
  # migration note is specifically for people upgrading from pre-Seerr images
  # where UID 1000 was previously hardcoded). Running Seerr as 99:100 keeps
  # it consistent with the rest of the stack and with Unraid's nobody:users.
  # ---------------------------------------------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: "${PUID}:${PGID}"
    networks:
      - frontend
      # Dual-homed onto automation so seerr can resolve radarr/sonarr/lidarr
      # by container name (they live only on automation+downloaders, not
      # frontend). Without this, Seerr's *arr server config has to use the
      # host LAN IP and bounce through the published port — works, but
      # routes traffic out of the bridge and back in for no reason.
      - automation
    environment:
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/seerr:/app/config
    ports:
      - "127.0.0.1:5055:5055"
    restart: unless-stopped
    healthcheck:
      # wget, NOT curl: ghcr.io/seerr-team/seerr is Debian-based and ships no
      # curl, so the previous probe failed with "curl: not found" on every
      # interval and this service has never once reported healthy. Do not
      # "fix" this back to curl — it looks consistent with the *arrs (hotio
      # images, which do ship curl) and is wrong here.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # TAUTULLI — Plex analytics, stream history, user activity, newsletters
  # config.ini is pre-seeded with the API key; the rest (Plex server
  # connection, notifications) is completed via the wizard on first open.
  # ---------------------------------------------------------------------------
  tautulli:
    image: ghcr.io/hotio/tautulli:release
    container_name: tautulli
    networks:
      - frontend
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/tautulli:/config
      - ${STACK_DIR}/configs/tautulli/config.ini:/config/config.ini
    ports:
      # Loopback only. Backend for svc:tautulli and the host debug path.
      - "127.0.0.1:8181:8181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # PROFILARR — web UI for managing quality profiles + custom formats in
  # Radarr/Sonarr. Subscribes to one or more "databases" (Dictionarry DB,
  # TRaSH Guides, others) and syncs selected profiles/formats via each
  # *arr's REST API. Replaces Recyclarr.
  #
  # Unlike the rest of the stack, Profilarr is not pre-seeded — its
  # subscription state lives in a SQLite DB at /config. First-run setup
  # is a manual UI flow (documented in docs/deployment.md). Appdata is
  # backed up with everything else so the state survives rebuild.
  #
  # Reachable only via Tailscale to the Unraid host's LAN IP at :6868.
  # No public exposure.
  # ---------------------------------------------------------------------------
  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    networks:
      - automation
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /mnt/user/appdata/profilarr:/config
    ports:
      # Loopback only. Backend for svc:profilarr and the host debug path.
      - "127.0.0.1:6868:6868"
    restart: unless-stopped
    healthcheck:
      # wget, NOT curl — santiagosayshey/profilarr ships no curl. Same
      # never-passed history as seerr above.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6868/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # BAZARR — subtitle automation
  # config.ini pre-generated with Sonarr + Radarr connections.
  # Same lazy-HTTP rationale as Seerr: no runtime `depends_on` needed.
  # ---------------------------------------------------------------------------
  bazarr:
    image: ghcr.io/hotio/bazarr:release
    container_name: bazarr
    networks:
      - frontend
      # bazarr talks to sonarr/radarr which are dual-homed on automation.
      - automation
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/bazarr:/config
      - ${STACK_DIR}/configs/bazarr/config.ini:/config/config.ini
      - /mnt/user/data/media:/data/media
    ports:
      # Loopback only. Backend for svc:bazarr and the host debug path.
      - "127.0.0.1:6767:6767"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # OLLAMA — local LLM inference, second-priority tenant of the RTX 3050
  #
  # THE CORE CONSTRAINT: the 3050 LP has 6 GB of VRAM and Plex owns it. NVENC
  # and NVDEC are dedicated ASIC blocks, so inference does not starve the
  # encoder for shader time — the resource these two actually fight over is
  # VRAM capacity. Every knob below caps Ollama's footprint so a transcode
  # always has room to allocate.
  #
  # Two mechanisms, both pure configuration, no daemon watching anything:
  #
  #   1. OLLAMA_GPU_OVERHEAD — a hard reservation Ollama never allocates into.
  #      This is what actually guarantees Plex can start a transcode. It holds
  #      unconditionally, and if a model doesn't fit in what's left, Ollama
  #      spills layers to CPU instead of OOMing the card. Failure mode is
  #      "slower", never "Plex can't transcode".
  #   2. OLLAMA_KEEP_ALIVE — Ollama's own eviction. A model unloads after this
  #      much idle time (upstream default is 5m; 60s here hands the card back
  #      much sooner). Local AI use on this box is bursty, so most of the time
  #      nothing is resident at all.
  #
  # The bounded-footprint knobs (MAX_LOADED_MODELS / NUM_PARALLEL /
  # CONTEXT_LENGTH / KV cache type) exist so that "how much VRAM is Ollama
  # using" has one predictable answer instead of scaling with concurrent
  # callers — which is what makes the reservation above meaningful.
  #
  # ACCEPTED LIMITATION: keep_alive is an idle timer, not a response to GPU
  # pressure — it doesn't know Plex exists. If a transcode starts seconds
  # after an inference, Ollama keeps its VRAM for the rest of the window. The
  # reservation covers this: Plex still gets its headroom. It's only a real
  # problem if Plex needs MORE than the reservation at that moment (roughly
  # 2+ concurrent 4K HDR tone-mapping transcodes), where the extra sessions
  # fall back to CPU transcoding. If that ever shows up in practice, the fix
  # is to raise OLLAMA_GPU_OVERHEAD_BYTES or run a smaller model — see
  # docs/decisions.md for the preemption design this replaced.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    networks:
      # Consumer plane. Containers that need an LLM join this network and
      # reach http://ollama:11434 — see the commented example below.
      - ai
    # Runs as nobody:users like the rest of the stack rather than the image's
    # default root. Ollama needs no privileges — /dev/nvidia* is world-
    # accessible — but HOME must point somewhere writable, because that's
    # where it keeps models and its (unused) signing key.
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - HOME=/ollama
      # compute for CUDA, utility for nvidia-smi + library discovery. Plex asks
      # for compute,video; neither asks for `all` (which adds graphics/display
      # and is the broader surface CVE-2024-0132 abused).
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0:11434
      # Bytes of VRAM Ollama must leave alone. Default 2147483648 (2 GiB)
      # covers a couple of concurrent 4K HDR tone-mapping transcodes.
      - OLLAMA_GPU_OVERHEAD=${OLLAMA_GPU_OVERHEAD_BYTES:-2147483648}
      # Hand VRAM back after this much idle time.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-60s}
      # One model, one request at a time. On 6 GB, serving two models
      # concurrently means neither fits. Extra callers queue instead.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-64}
      # KV cache grows linearly with context, so context length is a VRAM knob
      # as much as a capability knob.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      # Flash attention is required for a quantised KV cache, and q8_0 halves
      # KV VRAM for a quality delta that is not measurable at this size. Set
      # OLLAMA_KV_CACHE_TYPE=f16 in .env to opt back out.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      # Model blobs land in ollama/models/ here. These are multi-GB and
      # re-downloadable — exclude this path from the Appdata Backup plugin
      # (docs/deployment.md) or a weekly backup grows by tens of GB.
      - /mnt/user/appdata/ollama:/ollama/.ollama
    ports:
      # Loopback only, same convention as every other backend in this stack:
      # for host-side debugging from the Unraid terminal, not for LAN or
      # Tailscale access. Nothing binds 0.0.0.0 and the router forwards only
      # 32400, so the only clients are stack containers and the host itself.
      # Deliberately NOT fronted by Caddy — there is no *.lan hostname for
      # Ollama, because nothing on the tailnet needs to reach it.
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    healthcheck:
      # The image ships no curl/wget; `ollama list` round-trips the local API
      # via OLLAMA_HOST, which is the same liveness signal.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start unpacks CUDA libraries before the API answers.
      start_period: 60s
    deploy:
      resources:
        limits:
          # Headroom to stage a model into VRAM, and to hold one in system RAM
          # if Ollama spills layers to CPU because a transcode has the card.
          #
          # 4G, not 8G: the pinned model is llama3.2:3b (~2.5 GB), and memory
          # ceilings across the stack sum close to the box's 32 GB once finance
          # and chess land. This is the first ceiling to trim because it is the
          # least load-bearing — the spill case it covers is already the
          # graceful-degradation path, so a tighter ceiling costs speed in a
          # situation that is itself the fallback.
          memory: 4G

  # --- Adding a local-AI consumer ---------------------------------------------
  # Join the `ai` network and point at Ollama. It serves an OpenAI-compatible
  # API at /v1, so most SDKs work unmodified with a placeholder key (Ollama
  # has no auth of its own and ignores the header).
  #
  #   some-ai-app:
  #     image: example/some-ai-app:latest
  #     container_name: some-ai-app
  #     networks:
  #       - ai
  #     environment:
  #       - OLLAMA_BASE_URL=http://ollama:11434
  #       - OPENAI_BASE_URL=http://ollama:11434/v1
  #       - OPENAI_API_KEY=unused
  #     restart: unless-stopped
  #
  # Note that anything on this network can also delete models — Ollama has no
  # read-only mode. That's an accepted trade for now given every member is a
  # container we chose to put there, and models re-pull in minutes. If the app
  # has an admin UI, add it to CADDY_SERVICES in generate-configs.py for
  # <name>.lan routing; that's the app's UI, not Ollama's API.
  # ----------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # ADGUARD HOME — tailnet split-DNS resolver
  #
  # Tailscale's admin console points the `lan` domain at TAILNET_HOST_IP:53;
  # this container answers with TAILNET_HOST_IP for any *.lan query via a
  # wildcard rewrite pre-seeded into AdGuardHome.yaml. That makes
  # radarr.lan / sonarr.lan / etc. resolve automatically on every tailnet
  # device with zero per-device config — no /etc/hosts edits, works on
  # iOS/Android.
  #
  # Port 53 is published on 0.0.0.0 because tailnet clients query the host
  # over the tailscale interface; loopback wouldn't reach them. Unraid
  # itself doesn't bind 53 by default, so this should be conflict-free —
  # `ss -tlnp | grep :53` on the host before deploying confirms.
  #
  # The admin UI lives on container :80 and is fronted by caddy at
  # adguard.lan, so it's not separately published — same Caddy ingress as
  # every other admin service.
  # ---------------------------------------------------------------------------
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    networks:
      - frontend
    volumes:
      - ${STACK_DIR}/configs/adguard/AdGuardHome.yaml:/opt/adguardhome/conf/AdGuardHome.yaml
      - /mnt/user/appdata/adguard/work:/opt/adguardhome/work
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped
    healthcheck:
      # adguard image ships wget. /control/status returns JSON when the
      # daemon is up post-init; before init it returns 403 which is also
      # "up enough" — both count as healthy.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:80/control/status >/dev/null 2>&1 || wget -q -O- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # CADDY — single ingress for every admin UI
  #
  # Each backend is reachable at http://<name>.lan/ — Caddy routes by Host
  # header to the docker-DNS name of the right backend. Joined to all three
  # networks so it can resolve every service. SAB and Prowlarr live in
  # gluetun's netns and have no bridge alias of their own, so the Caddyfile
  # points sab.lan / prowlarr.lan at gluetun:8080 / gluetun:9696 directly.
  #
  # auto_https off — HTTP only inside the tailnet. Tailscale already
  # provides authenticated, encrypted, end-to-end transport between every
  # device. Layering TLS on top would require either a public domain or
  # installing Caddy's internal CA root on every admin device — both poor
  # trade-offs vs the actual threat (which is "tailnet membership," not
  # network-level eavesdropping).
  #
  # admin off — there's nothing pushing config dynamically, the localhost
  # admin API on :2019 is dead weight + a small attack surface.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    networks:
      - frontend
      - automation
      - downloaders
    ports:
      - "80:80"
    volumes:
      - ${STACK_DIR}/configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/user/appdata/caddy:/data
    restart: unless-stopped
    healthcheck:
      # caddy:2-alpine ships busybox nc but no curl/wget. nc -z is enough
      # to confirm the listener is up; per-backend liveness lives on each
      # backend's own healthcheck.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
