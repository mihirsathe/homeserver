<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="vent" x="0" y="0" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="4" fill="#f1f5f9"/>
      <rect x="1" y="1.5" width="4" height="1" fill="#cbd5e1"/>
    </pattern>
  </defs>

  <rect width="820" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="80" y="38" font-size="18" font-weight="700" fill="#0f172a">15U rack &#xb7; garage</text>
  <text x="80" y="56" font-size="11" fill="#64748b">One uplink to the home router (1 GbE direct, shared-LOM iDRAC).</text>

  <!-- ============ POWER CABLES (LEFT side) ============ -->
  <!-- UPS -> R640 (x2) -->
  <g>
    <path d="M 80 432 L 50 432 L 50 250 L 80 250"
          fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4"/>
    <circle cx="80" cy="432" r="3" fill="#dc2626"/>
    <circle cx="80" cy="250" r="3" fill="#dc2626"/>
    <text x="14" y="246" font-size="9" font-weight="600" fill="#991b1b">&#xd7;2 IEC C13</text>
  </g>
  <!-- UPS -> MD1400 (x2) -->
  <g>
    <path d="M 80 442 L 30 442 L 30 320 L 80 320"
          fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4"/>
    <circle cx="80" cy="442" r="3" fill="#dc2626"/>
    <circle cx="80" cy="320" r="3" fill="#dc2626"/>
    <text x="14" y="316" font-size="9" font-weight="600" fill="#991b1b">&#xd7;2 IEC C13</text>
  </g>

  <!-- ============ RACK ============ -->
  <g transform="translate(80, 80)">
    <!-- Frame -->
    <rect x="0" y="0" width="300" height="470" fill="#fafbfc" stroke="#0f172a" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="300" height="10" fill="#0f172a"/>
    <rect x="0" y="460" width="300" height="10" fill="#0f172a"/>

    <!-- Inner rails -->
    <line x1="20" y1="10" x2="20" y2="460" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="280" y1="10" x2="280" y2="460" stroke="#cbd5e1" stroke-width="0.5"/>

    <!-- U numbers (just outside left frame) -->
    <g font-size="9" fill="#94a3b8" text-anchor="end">
      <text x="-6" y="28">15</text>
      <text x="-6" y="58">14</text>
      <text x="-6" y="88">13</text>
      <text x="-6" y="118">12</text>
      <text x="-6" y="148">11</text>
      <text x="-6" y="178">10</text>
      <text x="-6" y="208">9</text>
      <text x="-6" y="238">8</text>
      <text x="-6" y="268">7</text>
      <text x="-6" y="298">6</text>
      <text x="-6" y="328">5</text>
      <text x="-6" y="358">4</text>
      <text x="-6" y="388">3</text>
      <text x="-6" y="418">2</text>
      <text x="-6" y="448">1</text>
    </g>

    <!-- U15-U12: future upgrade (dashed border) -->
    <g transform="translate(20, 10)">
      <rect width="260" height="120" fill="url(#vent)" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="5 3"/>
      <text x="130" y="65" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">reserved &#xb7; future managed switch</text>
    </g>

    <!-- U11: thermal break (solid border) -->
    <g transform="translate(20, 130)">
      <rect width="260" height="30" fill="url(#vent)" stroke="#cbd5e1" stroke-width="0.75"/>
      <text x="130" y="19" font-size="8" fill="#94a3b8" text-anchor="middle">thermal break</text>
    </g>

    <!-- U10: R640 -->
    <g transform="translate(20, 160)">
      <rect width="260" height="30" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
      <g transform="translate(8, 4)">
        <rect x="0"   y="0" width="14" height="22" fill="#1d4ed8" stroke="#0b1d4d" stroke-width="0.5"/>
        <rect x="16"  y="0" width="14" height="22" fill="#1d4ed8" stroke="#0b1d4d" stroke-width="0.5"/>
        <rect x="32"  y="0" width="14" height="22" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="48"  y="0" width="14" height="22" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="64"  y="0" width="14" height="22" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="80"  y="0" width="14" height="22" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="96"  y="0" width="14" height="22" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="112" y="0" width="14" height="22" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <circle cx="11" cy="19" r="1" fill="#22c55e"/>
        <circle cx="27" cy="19" r="1" fill="#22c55e"/>
      </g>
      <text x="160" y="19" fill="#f1f5f9" font-size="11" font-weight="600">Dell R640</text>
    </g>

    <!-- U9: thermal break (solid border) -->
    <g transform="translate(20, 190)">
      <rect width="260" height="30" fill="url(#vent)" stroke="#cbd5e1" stroke-width="0.75"/>
      <text x="130" y="19" font-size="8" fill="#94a3b8" text-anchor="middle">thermal break</text>
    </g>

    <!-- U7-U8: MD1400 -->
    <g transform="translate(20, 220)">
      <rect width="260" height="60" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
      <g transform="translate(8, 6)">
        <!-- Row 1: parity + 3 data -->
        <rect x="0"   y="0"  width="36" height="14" fill="#b45309" stroke="#7c2d12" stroke-width="0.5"/>
        <rect x="38"  y="0"  width="36" height="14" fill="#6d28d9" stroke="#4c1d95" stroke-width="0.5"/>
        <rect x="76"  y="0"  width="36" height="14" fill="#6d28d9" stroke="#4c1d95" stroke-width="0.5"/>
        <rect x="114" y="0"  width="36" height="14" fill="#6d28d9" stroke="#4c1d95" stroke-width="0.5"/>
        <!-- Row 2: 1 data + 3 empty -->
        <rect x="0"   y="16" width="36" height="14" fill="#6d28d9" stroke="#4c1d95" stroke-width="0.5"/>
        <rect x="38"  y="16" width="36" height="14" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="76"  y="16" width="36" height="14" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="114" y="16" width="36" height="14" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <!-- Row 3: 4 empty -->
        <rect x="0"   y="32" width="36" height="14" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="38"  y="32" width="36" height="14" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="76"  y="32" width="36" height="14" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <rect x="114" y="32" width="36" height="14" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <!-- Active LEDs -->
        <circle cx="33" cy="11" r="1" fill="#22c55e"/>
        <circle cx="71" cy="11" r="1" fill="#22c55e"/>
        <circle cx="109" cy="11" r="1" fill="#22c55e"/>
        <circle cx="147" cy="11" r="1" fill="#22c55e"/>
        <circle cx="33" cy="27" r="1" fill="#22c55e"/>
      </g>
      <text x="190" y="34" fill="#f1f5f9" font-size="11" font-weight="600">Dell MD1400</text>
    </g>

    <!-- U5-U6: future upgrade (dashed border) -->
    <g transform="translate(20, 280)">
      <rect width="260" height="60" fill="url(#vent)" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="5 3"/>
      <text x="130" y="34" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">reserved &#xb7; second MD1400 (daisy-chain)</text>
    </g>

    <!-- U3-U4: UPS -->
    <g transform="translate(20, 340)">
      <rect width="260" height="60" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
      <!-- LCD panel -->
      <rect x="10" y="14" width="64" height="32" fill="#082f49" stroke="#0c4a6e" stroke-width="0.5" rx="1"/>
      <text x="42" y="36" fill="#22d3ee" font-size="14" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-weight="600">93%</text>
      <!-- Faceplate buttons -->
      <circle cx="92" cy="22" r="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
      <circle cx="92" cy="38" r="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
      <text x="190" y="34" fill="#f1f5f9" font-size="11" font-weight="600">APC Smart-UPS</text>
    </g>

    <!-- U1-U2: future upgrade (dashed border) -->
    <g transform="translate(20, 400)">
      <rect width="260" height="60" fill="url(#vent)" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="5 3"/>
      <text x="130" y="34" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">reserved &#xb7; UPS battery expansion</text>
    </g>
  </g>

  <!-- ============ HOME ROUTER ============ -->
  <g transform="translate(560, 130)">
    <rect width="160" height="58" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="4"/>
    <text x="80" y="26" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Home router</text>
    <g transform="translate(72, 36)" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round">
      <path d="M 0 8 Q 8 -2 16 8"/>
      <path d="M 3 8 Q 8 2 13 8"/>
      <circle cx="8" cy="8" r="1" fill="#64748b" stroke="none"/>
    </g>
  </g>

  <!-- ============ DATA CABLES (RIGHT side) ============ -->
  <!-- Cat6A: R640 -> router -->
  <g>
    <path d="M 380 255 L 410 255 L 410 159 L 560 159"
          fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="380" cy="255" r="3" fill="#3b82f6"/>
    <circle cx="560" cy="159" r="3" fill="#3b82f6"/>
    <text x="418" y="120" fill="#1e40af" font-size="9" font-weight="600">Cat6A &#xb7; 1 GbE</text>
    <text x="418" y="132" fill="#1e40af" font-size="8">LAN + iDRAC (shared LOM)</text>
  </g>

  <!-- SAS: R640 <-> MD1400 -->
  <g>
    <path d="M 380 265 L 440 265 L 440 320 L 380 320"
          fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="380" cy="265" r="3" fill="#ea580c"/>
    <circle cx="380" cy="320" r="3" fill="#ea580c"/>
    <text x="450" y="290" fill="#9a3412" font-size="9" font-weight="600">SFF-8644</text>
    <text x="450" y="302" fill="#9a3412" font-size="8">12 Gb/s SAS</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(80, 575)">
    <line x1="0"   y1="-3" x2="34" y2="-3" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="40"  y="0" font-size="10" fill="#334155">Ethernet</text>
    <line x1="110" y1="-3" x2="144" y2="-3" stroke="#ea580c" stroke-width="2.5"/>
    <text x="150" y="0" font-size="10" fill="#334155">SAS</text>
    <line x1="190" y1="-3" x2="224" y2="-3" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="230" y="0" font-size="10" fill="#334155">Power</text>
    <rect x="290" y="-7" width="14" height="8" fill="#b45309"/>
    <text x="308" y="0" font-size="10" fill="#334155">parity</text>
    <rect x="354" y="-7" width="14" height="8" fill="#6d28d9"/>
    <text x="372" y="0" font-size="10" fill="#334155">data</text>
    <rect x="412" y="-7" width="14" height="8" fill="#1d4ed8"/>
    <text x="430" y="0" font-size="10" fill="#334155">cache</text>
    <rect x="478" y="-7" width="14" height="8" fill="url(#vent)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 1.5"/>
    <text x="496" y="0" font-size="10" fill="#334155">reserved (future)</text>
  </g>
</svg>
